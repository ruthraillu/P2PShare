name: Compile P2PShare

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "1"
  RAYON_NUM_THREADS: "1"

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile Windows x64
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable build --locked --release --target x86_64-pc-windows-msvc -p p2pshare-desktop -j 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --locked --release --target x86_64-pc-windows-msvc -p p2pshare-desktop-design --lib -j 1 updates::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --locked --release --target x86_64-pc-windows-msvc -p p2pshare-desktop-ui --lib -j 1 updater::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path ci-out | Out-Null
          Copy-Item '.build/target/x86_64-pc-windows-msvc/release/P2PShare.exe' 'ci-out/P2PShare.exe'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: ci-out/P2PShare.exe
          if-no-files-found: error

  android:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Android ARM64 build tools
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RUSTUP_TOOLCHAIN = 'stable'
          .\tools\setup-android.ps1
      - name: Build Android ARM64 APK
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v') }}
          P2PSHARE_ANDROID_SIGNING_KEY: ${{ github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v') && secrets.P2PSHARE_ANDROID_SIGNING_KEY || '' }}
        run: |
          $env:RUSTUP_TOOLCHAIN = 'stable'
          if ($env:RELEASE_TAG -eq 'true') {
            if (!$env:P2PSHARE_ANDROID_SIGNING_KEY) { throw 'Missing Android release signing secret.' }
            $key = Join-Path $env:RUNNER_TEMP 'p2pshare-android-release.p12'
            try {
              [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:P2PSHARE_ANDROID_SIGNING_KEY))
              Remove-Item Env:P2PSHARE_ANDROID_SIGNING_KEY
              .\build-android.ps1 -Action release -SigningKey $key
              $apk = 'releases/android/P2PShare-android-arm64.apk'
              $signer = '.build/android-sdk/build-tools/36.0.0/lib/apksigner.jar'
              $verify = & java -jar $signer verify --print-certs $apk
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if (-not ($verify -match 'certificate SHA-256 digest: a044729b4e041b4821edcedfb49a155631e3b5b7884c88410725383cfe19d2f2$')) {
                throw 'APK does not use the pinned release certificate.'
              }
            } finally {
              if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Force }
            }
          } else {
            .\build-android.ps1 -Action release
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v') && 'android-arm64' || 'android-arm64-test' }}
          path: releases/android/P2PShare-android-arm64.apk
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64
          path: release-out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-arm64
          path: release-out
      - name: Assemble the portable Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          seed_tag="$(python3 -c 'import json; print(json.load(open("vendor/ffmpeg-runtime/codec-seed.json"))["tag"])')"
          gh release download "$seed_tag" --pattern P2PShare-Windows-x64.zip --dir release-out/codec-seed
          python3 tools/package-windows-release.py --exe release-out/P2PShare.exe \
            --seed-zip release-out/codec-seed/P2PShare-Windows-x64.zip \
            --output release-out/P2PShare-Windows-x64.zip
      - name: Sign and publish the Windows and Android release
        env:
          GH_TOKEN: ${{ github.token }}
          P2PSHARE_WINDOWS_SIGNING_KEY: ${{ secrets.P2PSHARE_WINDOWS_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ && "$TAG" == "v$version" ]] || {
            echo "The release tag must match the stable workspace version." >&2
            exit 1
          }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Check its assets before retrying." >&2
            exit 1
          fi
          [[ -n "$P2PSHARE_WINDOWS_SIGNING_KEY" ]] || {
            echo "Missing Windows release signing secret." >&2
            exit 1
          }
          umask 077
          key="$(mktemp "$RUNNER_TEMP/p2pshare-key.XXXXXX")"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$P2PSHARE_WINDOWS_SIGNING_KEY" | base64 --decode > "$key"
          unset P2PSHARE_WINDOWS_SIGNING_KEY
          sign() {
            local asset="$1" domain="$2" hash size
            read -r hash _ < <(sha256sum "$asset")
            size="$(stat -c '%s' "$asset")"
            printf '%s\n%s\n%s\n%s\n' "$domain" "$version" "$hash" "$size" > release-out/signing-message
            openssl pkeyutl -sign -rawin -inkey "$key" -in release-out/signing-message -out "$asset.sig"
            [[ "$(stat -c '%s' "$asset.sig")" == "64" ]]
          }
          zip=release-out/P2PShare-Windows-x64.zip
          sign "$zip" 'P2PShare Windows x64 ZIP update v2'
          set -- "$zip" "$zip.sig" release-out/P2PShare-android-arm64.apk
          # Bridge for versions that only understand EXE updates.
          if [[ "$TAG" == v0.13.1 ]]; then
            exe=release-out/P2PShare.exe
            sign "$exe" 'P2PShare Windows x64 update v1'
            set -- "$@" "$exe" "$exe.sig"
          fi
          gh release create "$TAG" "$@" --verify-tag --title "P2PShare $TAG" --generate-notes --latest
