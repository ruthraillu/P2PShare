[package]
name = "p2pshare-discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
anyhow.workspace = true
base64.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
p2pshare-control-iroh.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
http = "1"
sha2 = "0.10"
nostr = { version = "=0.45.5", default-features = false, features = ["std", "os-rng"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-websockets = { version = "0.13", features = ["client", "ring", "rustls-webpki-roots"] }
[dev-dependencies]
tokio-websockets = { version = "0.13", features = ["server", "sha1_smol"] }
