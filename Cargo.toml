[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop", "apps/android"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
base64 = "0.22"
rand = "0.9"
p2pshare-discovery = { path = "crates/discovery" }
p2pshare-session = { path = "crates/session" }
p2pshare-rtc = { path = "crates/rtc" }
p2pshare-control-iroh = { path = "crates/control-iroh" }
p2pshare-codecs-windows = { path = "crates/codecs-windows" }
egui = "0.35"
p2pshare-room-ui = { path = "crates/room-ui" }
p2pshare-protocol = { path = "crates/protocol" }
p2pshare-core = { path = "crates/core" }
p2pshare-media = { path = "crates/media" }
p2pshare-connectivity = { path = "crates/connectivity" }
p2pshare-platform-windows = { path = "crates/platform-windows" }
p2pshare-desktop-ui = { path = "crates/desktop-ui" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
windows = { version = "0.62", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Media_DirectShow", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }




# Keep large async network/UI crates within limited commit memory while other
# desktop applications are running. Cargo/LLVM share a single build-job token.
[profile.release.package.p2pshare-session]
opt-level = 1
codegen-units = 64
[profile.release.package.p2pshare-desktop-ui]
opt-level = 2
codegen-units = 16
[profile.release.package.p2pshare-android]
opt-level = 2
codegen-units = 16

# Cache unchanged egui geometry instead of rebuilding D3D buffers every video frame.
[patch.crates-io]
egui-directx11 = { path = "vendor/egui-directx11" }
winit = { path = "vendor/winit" }
